<style>
:root {
  --bg:#0d0e14; --surf:#15161f; --surf2:#1e2030; --border:#2a2d40;
  --accent:#e8c547; --accent2:#e87f3a; --ok:#4ec98a;
  --text:#eeedf5; --muted:#7a7d99;
  --set2:#e8c547; --set3:#4ec98a;
  --r:12px; --shadow:0 6px 28px rgba(0,0,0,.55);
  --fs:1rem;  /* base font scale for card text */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Serif 4',serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}


/* ── MENÜ ── */
.menu-wrap{position:relative;margin-left:auto}
#menu-panel{display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:260px;z-index:300;
  background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:10px;
  flex-direction:column;gap:6px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#menu-panel.open{display:flex}
#menu-panel button.btn{width:100%;text-align:left}
.menu-fs{display:flex;flex-direction:column;gap:6px;font-family:'Syne',sans-serif;font-size:.8rem;
  color:var(--text);padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:2px}
.menu-fs input{width:100%;accent-color:var(--accent)}
/* ── TOP BAR ── */
#bar{position:sticky;top:0;z-index:100;background:var(--surf);border-bottom:1px solid var(--border);
  padding:8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;
  letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-right:4px}
select,button.btn{background:var(--surf2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:5px 11px;font-family:'Syne',sans-serif;font-size:.8rem;
  cursor:pointer;transition:all .15s;white-space:nowrap;outline:none}
select:focus,button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
button.btn.act-off{border-color:var(--accent2);color:var(--accent2)}

/* ── PER-CARD SET TOGGLE ── */
.card-set-row{display:flex;gap:5px;margin-top:10px;flex-shrink:0}
.card-set-btn{font-family:'Syne',sans-serif;font-size:.65rem;font-weight:700;
  letter-spacing:1px;padding:3px 9px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);background:var(--surf2);color:var(--muted);
  transition:all .15s;user-select:none}
.card-set-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-set-btn.s1.active{background:var(--set2);color:#000;border-color:var(--set2)}
.card-set-btn.s2.active{background:var(--set3);color:#000;border-color:var(--set3)}
.card-alt{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px}
.card-alt-lbl{font-family:'Syne',sans-serif;font-size:.6rem;color:var(--muted);
  letter-spacing:1px;margin-bottom:5px}
#timer-d{font-family:'Syne',sans-serif;font-weight:700;font-size:1.25rem;
  letter-spacing:3px;color:var(--accent);min-width:62px;text-align:center}
#timer-d.warn{color:#f05060;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.bar-sep{flex:1}

/* ── AMPEL ── */
.card-traffic{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:7px}
.tl-btn{width:22px;height:22px;border-radius:50%;border:2px solid;background:transparent;cursor:pointer;padding:0;opacity:.55}
.tl-btn:hover,.tl-btn.on{opacity:1}
.tl-btn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.tl-r{color:#e5484d;border-color:#e5484d}.tl-r.on{background:#e5484d}
.tl-y{color:#f0b429;border-color:#f0b429}.tl-y.on{background:#f0b429}
.tl-g{color:#3ec97f;border-color:#3ec97f}.tl-g.on{background:#3ec97f}
.card.st-r{background:#3a1519;border-color:#e5484d}
.card.st-y{background:#3a2f12;border-color:#f0b429}
.card.st-g{background:#12331f;border-color:#3ec97f}
.card[data-type="q"]{padding-right:50px}
/* ── GRID ── */
#grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 18px;
  max-width:1380px;margin:0 auto}

/* ── CARD ── */
.card{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);
  padding:18px 20px;position:relative;transition:border-color .2s,transform .1s;
  animation:fadeUp .25s ease both;cursor:pointer;user-select:none}
.card:hover{border-color:var(--accent)}
.card:active{transform:scale(.99)}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card-act{grid-column:1/-1;border-color:var(--accent2);
  background:linear-gradient(130deg,var(--surf) 0%,#22180f 100%)}
.card-act:hover{border-color:var(--accent2)}
.card-act.hidden{display:none}

/* card header */
.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-num{width:22px;height:22px;border-radius:50%;background:var(--accent);
  color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:.72rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-act .card-num{background:var(--accent2)}
.card-lbl{font-family:'Syne',sans-serif;font-size:.65rem;font-weight:600;

.card-act .card-lbl{color:var(--accent2)}
.card-src{font-family:'Syne',sans-serif;font-size:.62rem;color:var(--muted);

/* card body */

.katex-display{margin:.35em 0;overflow-x:auto}

/* solution */

.sol-body{font-size:calc(var(--fs) * 0.9);line-height:1.65;color:var(--text);opacity:.9}

/* ── EDITOR OVERLAY ── */
#editor-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);

#editor-overlay.open{display:flex}
#editor-box{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--r);

#editor-box h3{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;

.ed-row label{font-family:'Syne',sans-serif;font-size:.7rem;color:var(--muted);letter-spacing:1px}

  min-height:90px;resize:vertical;line-height:1.6;outline:none}
.ed-row textarea:focus{border-color:var(--accent)}
.ed-preview{background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;min-height:50px;font-size:.9rem;line-height:1.7}
.ed-img-area{border:2px dashed var(--border);border-radius:8px;padding:20px;
  text-align:center;cursor:pointer;transition:border-color .15s;font-family:'Syne',sans-serif;
  font-size:.78rem;color:var(--muted)}
.ed-img-area:hover,.ed-img-area.drag{border-color:var(--accent);color:var(--accent)}
.ed-img-preview{max-width:100%;height:auto;margin:8px auto 0;display:block;border-radius:6px}
.ed-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#ed-scale{appearance:auto}
.ed-btns button{padding:8px 18px;border-radius:8px;font-family:'Syne',sans-serif;
  font-size:.8rem;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s}
#ed-save{background:var(--accent);color:#000;border-color:var(--accent)}
#ed-save:hover{opacity:.85}
#ed-cancel{background:transparent;color:var(--muted);border-color:var(--border)}
#ed-cancel:hover{border-color:var(--text);color:var(--text)}
#ed-del-img{background:transparent;color:#f05060;border-color:#f05060;display:none}
#ed-del-img.show{display:block}
#ed-del-img:hover{background:#f05060;color:#fff}

/* ── HINT BAR ── */
#hint{text-align:center;padding:6px 0 12px;font-family:'Syne',sans-serif;
  font-size:.68rem;color:var(--muted);letter-spacing:.4px}
.kk{background:var(--surf2);border:1px solid var(--border);border-radius:4px;
  padding:1px 6px;font-size:.75em;margin:0 2px}

/* ── TIMER BAR ── */
#tbar-wrap{position:fixed;bottom:0;left:0;width:100%;height:3px;background:var(--surf2);z-index:200}
#tbar{height:100%;background:var(--accent);width:100%;transition:width 1s linear,background .4s}

#grid-copy{display:none}
.sol-body.sol-one{font-size:calc(var(--fs) * 0.9 * 1.4)}
@media screen{
  body.fit #grid{grid-template-rows:1fr 1fr auto;gap:10px;padding:10px 14px;overflow:hidden;max-width:none;align-content:stretch}

  body.fit .card{min-height:0}

  body.fit .card[data-type="q"]>.card-img{flex:1 1 0;min-height:40px;width:auto!important;height:auto;max-width:calc(var(--sc,100) * 1%);object-fit:contain;object-position:left top;align-self:flex-start}
  body.fit .card-act{overflow:auto;max-height:26vh}
}
/* ── PRINT ── */
@media print{
  @page{size:A4 portrait;margin:1.2cm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
    box-sizing:border-box!important}
  html,body{width:auto!important;height:auto!important;
    margin:0!important;padding:0!important;
    background:#fff!important;color:#000!important;overflow:visible!important}
  html,body{min-height:0!important;max-height:none!important}
  body{min-height:0!important;height:246mm!important;max-height:246mm!important;overflow:hidden!important;break-after:avoid!important;page-break-after:avoid!important}
  #toast,#shift-overlay,#editor-overlay{display:none!important}
  .card-traffic,#hint,#tbar-wrap,#toast{display:none!important;position:static!important}
  .card{animation:none!important;opacity:1!important;transform:none!important}
  #bar,#hint,#tbar-wrap,#editor-overlay{display:none!important}
  .card-act,[data-type="act"]{display:none!important}
  .card-set-row{display:none!important}
  .card-alt{display:none!important}

  /* Ohne Lösungen: Lösungsboxen versteckt, Lösungsfeld als gestrichelter Kasten */
  body:not(.print-with-sol) .card-sol{display:none!important}
  body:not(.print-with-sol) .card[data-type="q"]::after{
    content:''!important;display:block!important;flex:1!important;
    border:1.5px dashed #ccc!important;border-radius:4px!important;
    margin-top:8px!important;min-height:0!important;
  }

  /* Mit Lösungen: Lösungen sichtbar, kein leerer Kasten */
  body.print-with-sol .card-sol{
    display:block!important;
    margin-top:10px!important;padding-top:8px!important;
    border-top:1px dashed #bbb!important;
    flex:1!important;overflow:hidden!important;
  }
  body.print-with-sol .sol-label{
    font-size:.52rem!important;font-weight:700!important;letter-spacing:1.2px!important;
    text-transform:uppercase!important;color:#27825a!important;margin-bottom:4px!important;
  }
  body.print-with-sol .sol-body{
    font-size:.68rem!important;color:#000!important;line-height:1.45!important;
  }

  /* Grid: 2×2, füllt das komplette A4-Blatt */
  #grid{
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
    grid-template-rows:1fr 1fr!important;
    gap:10px!important;
    padding:0!important;margin:0!important;
    width:100%!important;
    height:118mm!important;
    overflow:hidden!important;
  }
  .card[data-type="q"]{
    background:#fff!important;border:1.5px solid #999!important;
    border-radius:6px!important;padding:7px 9px!important;
    display:flex!important;flex-direction:column!important;
    overflow:hidden!important;break-inside:avoid!important;min-height:0!important;
  }
  .card-hd{margin-bottom:8px!important;flex-shrink:0!important}
  .card-num{background:#222!important;color:#fff!important}
  .card-lbl{color:#444!important}
  .card-src{color:#888!important;font-size:.5rem!important}
  .card-q{font-size:.73rem!important;color:#000!important;
    flex-shrink:0!important;line-height:1.55!important}

  /* Bilder: Breite via Inline-Stil (scale%), Höhe proportional, kein Overflow */
  .card-img{
    max-width:100%!important;
    width:calc(var(--disp,var(--sc,100)) * .8%)!important;
    height:auto!important;
    object-fit:unset!important;
    display:block!important;
    margin-top:6px!important;
    flex-shrink:0!important;
  }

  /* Duplicate grid for second copy */
  #grid-copy{
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
    grid-template-rows:1fr 1fr!important;
    gap:10px!important;
    padding:0!important;margin:0!important;
    width:100%!important;
    height:122mm!important;
    overflow:hidden!important;
    margin-top:4mm!important;border-top:1.5px dashed #888!important;padding-top:4mm!important;
    break-before:auto!important;page-break-before:auto!important;page-break-after:auto!important;break-after:auto!important;
  }
  #grid-copy .card-set-row{display:none!important}
  #grid-copy .card-alt{display:none!important}
  #grid-copy .card-act,[data-type="act"]{display:none!important}
  #grid-copy .card-sol{display:none!important}
  body.print-with-sol #grid-copy .card-sol{
    display:block!important;margin-top:8px!important;padding-top:8px!important;
    border-top:1px dashed #bbb!important;flex:1!important;overflow:hidden!important;
  }
}

@media print{
  body.ipad #grid{height:98mm!important}
  body.ipad #grid-copy{height:102mm!important}
  body.ipad{height:auto!important;max-height:none!important;overflow:visible!important}
  body.ipad .card[data-type="q"]{padding:5px 7px!important}
  html{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}
  body.ipad .card-q{font-size:.58rem!important;line-height:1.45!important}
  body.ipad .card-src{font-size:.4rem!important}
  body.ipad .card-lbl{font-size:.42rem!important}
  body.ipad.print-with-sol .sol-body{font-size:.54rem!important}
  body.ipad.print-with-sol .sol-label{font-size:.42rem!important}
}

/* ── SHIFT CONFIRM OVERLAY ── */
#shift-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:600;align-items:center;justify-content:center;padding:20px}

</style>

// ─── Font scale ────────────────────────────────────────────────
const FS_STEP = 0.05;
const FS_MIN  = 0.6;
const FS_MAX  = 2.0;

function setFontScale(v) {
  _fs = Math.max(FS_MIN, Math.min(FS_MAX, v));

function rpKey(w, l) { return `${w},${l}`; }
function qKey(w, l)  { return `${w},${l}`; }

function getTopicLabel(ref) {
  if (!ref) return "—";
  return DATA.LABEL[rpKey(ref[0], ref[1])] || `W${ref[0]}/Std.${ref[1]}`;
}

function getLessonData() {
  const rp = DATA.RP[rpKey(ST.week, ST.lesson)];
  // If no RP entry, show 4 empty cards
  const refs = rp || [null, null, null, null];
  const cards = [];
  const activator = { q: null, sol: null };

  // Build 4 review cards (empty if ref is null)
  for (let i = 0; i < 4; i++) {
    const ref = refs[i];
    const s = cardSet(i);   // per-card set (2 or 3)
    const edKey = `${ST.week},${ST.lesson},${s},${i}`;
    const qOver = DATA.SOL[edKey + ',q'];
    const sOver = DATA.SOL[edKey + ',s'];
    const img = DATA.IMG[edKey] || null;
    const lblOver = DATA.SOL[edKey + ',lbl'];

    let q = qOver !== undefined ? qOver : null;
    let sol = sOver !== undefined ? sOver : null;

    if (q === null && ref) {
      const [rw, rl] = ref;
      const qdata = DATA.Q[qKey(rw, rl)];
      if (qdata && qdata[s]) {
        const slot = qdata[s];
        const idx = Math.min(i, slot.cards.length - 1);
        q = slot.cards[idx];
      }
    }

    // Alt card (the other set) for toggle display
    const sAlt = s === 2 ? 3 : 2;
    const edKeyAlt = `${ST.week},${ST.lesson},${sAlt},${i}`;
    const qAltOver = DATA.SOL[edKeyAlt + ',q'];
    let qAlt = qAltOver !== undefined ? qAltOver : null;
    let solAlt = DATA.SOL[edKeyAlt + ',s'] || null;
    if (qAlt === null && ref) {
      const [rw, rl] = ref;
      const qdata = DATA.Q[qKey(rw, rl)];
      if (qdata && qdata[sAlt]) {
        const slot = qdata[sAlt];
        const idx = Math.min(i, slot.cards.length - 1);
        qAlt = slot.cards[idx];
      }
    }

    const srcLabel = lblOver !== undefined
      ? lblOver
      : (ref ? getTopicLabel(ref) : '—');

    cards.push({ q: q || '', sol: sol || null, img, ref, srcLabel, qAlt: qAlt || '', solAlt, s });
  }

  // Activator: use set 2 by default
  const actS = 2;
  const edKeyA = `${ST.week},${ST.lesson},${actS},act`;
  const actQOver = DATA.SOL[edKeyA + ',q'];
  const actSOver = DATA.SOL[edKeyA + ',s'];
  let actQ = actQOver !== undefined ? actQOver : null;
  let actSol = actSOver !== undefined ? actSOver : null;

  if (actQ === null) {
    const actRef = refs[0];
    if (actRef) {
      const [aw, al] = actRef;
      const aqd = DATA.Q[qKey(aw, al)];
      if (aqd && aqd[actS]) actQ = aqd[actS].act;
    }
  }
  activator.q = actQ || '';
  activator.sol = actSol;

  return { cards, activator };
}

function renderMath(el) {
  if (window._katexReady && window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError: false
    });
  } else {
    window._katexPending = () => renderMath(el);
  }
}

function processText(t) {
  if (!t) return '';
  return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function cardQHtml(q) {
  return (q && q.trim())
    ? processText(q)
    : '<span style="color:var(--muted);font-style:italic">Leer — Doppelklick zum Bearbeiten</span>';
}

function tlKey(ci){ return `${ST.week},${ST.lesson},${ci},tl`; }
// Einzeilige Lösungen (z. B. Ergebnisse) auf dem Bildschirm 40 % größer darstellen
function markOneLine(root) {
  (root || document).querySelectorAll('.card-sol.show .sol-body').forEach(b => {
    b.classList.remove('sol-one');
    const lh = parseFloat(getComputedStyle(b).lineHeight) || 20;
    if (b.textContent.trim().startsWith('Keine Lösung hinterlegt')) return;
    if (b.scrollHeight > 0 && b.scrollHeight <= lh * 1.5) b.classList.add('sol-one');
  });
}
function fitGrid() {
  const g = document.getElementById('grid');
  if (!g) return;
  const btn = document.getElementById('btn-fit');
  const on = document.body.classList.contains('fit');
  if (btn) btn.classList.toggle('active', on);
  if (!on) { g.style.height = ''; return; }
  const top = g.getBoundingClientRect().top + window.scrollY;
  const tb = document.getElementById('tbar-wrap');
  const extra = (tb && getComputedStyle(tb).display !== 'none' && getComputedStyle(tb).position === 'fixed') ? tb.offsetHeight : 0;
  g.style.height = Math.max(300, window.innerHeight - top - extra) + 'px';
}
function renderCards() {
  const grid = document.getElementById('grid');
  const data = getLessonData();

  let html = '';

  data.cards.forEach((card, i) => {
    const s = card.s; // active set for this card (2 or 3)
    const isS1 = s === 2;
    const altShown = ST.altShown.has(i);
    const solOpen = ST.openSols.has(i);

    // Alt card section (second set shown below)
    const altHtml = altShown ? `
      <div class="card-alt">
        <div class="card-alt-lbl">SET ${isS1 ? 2 : 1} — Alternativaufgabe</div>
        <div class="card-q">${cardQHtml(card.qAlt)}</div>
        ${solOpen && card.solAlt ? `
          <div class="card-sol show" style="margin-top:8px">
            <div class="sol-label">Lösung (Alt)</div>
            <div class="sol-body">${processText(card.solAlt)}</div>
          </div>` : ''}
      </div>` : '';

    const st = DATA.SOL[tlKey(i)] || '';
    html += `<div class="card${st ? ' st-'+st : ''}" data-ci="${i}" data-type="q">
      <div class="card-traffic">
        <button class="tl-btn tl-r${st==='r'?' on':''}" data-ci="${i}" data-c="r" title="Nochmal wiederholen"></button>
        <button class="tl-btn tl-y${st==='y'?' on':''}" data-ci="${i}" data-c="y" title="Unsicher"></button>
        <button class="tl-btn tl-g${st==='g'?' on':''}" data-ci="${i}" data-c="g" title="Sitzt"></button>
      </div>
      <div class="card-hd">
        <div class="card-num">${i+1}</div>
        <div class="card-lbl">Aufgabe</div>
        <div class="card-src">↩ ${card.srcLabel}</div>
      </div>
      <div class="card-q">${cardQHtml(card.q)}</div>
      ${card.img ? `<img class="card-img" src="${card.img.src}" style="width:${card.img.scale||100}%;--sc:${card.img.scale||100}" alt="">` : ''}
      <div class="card-sol${solOpen ? ' show' : ''}">
        <div class="sol-label">Lösung</div>
        <div class="sol-body">${card.sol ? processText(card.sol) : '<span style="color:var(--muted);font-style:italic">Keine Lösung hinterlegt — Doppelklick zum Bearbeiten</span>'}</div>
      </div>
      ${altHtml}
      <div class="card-set-row">
        <button class="card-set-btn s1${isS1 ? ' active' : ''}" data-ci="${i}" data-s="2">Set 1</button>
        <button class="card-set-btn s2${!isS1 ? ' active' : ''}" data-ci="${i}" data-s="3">Set 2</button>
        <button class="card-set-btn${altShown ? ' active' : ''}" data-ci="${i}" data-alt="1"
          style="margin-left:4px;${altShown ? 'border-color:var(--muted);color:var(--text)' : ''}">
          ${altShown ? '▲ Alt ausblenden' : '▼ Alt anzeigen'}
        </button>
      </div>
    </div>`;
  });

  // Activator
  const actHasQ = data.activator.q && data.activator.q.trim();
  const actQHtml = actHasQ
    ? processText(data.activator.q)
    : '<span style="color:var(--muted);font-style:italic">Leer — Doppelklick zum Bearbeiten</span>';
  const actVisible = ST.showAct ? '' : ' hidden';
  html += `<div class="card card-act${actVisible}" data-ci="act" data-type="act">
    <div class="card-hd">
      <div class="card-num">★</div>
      <div class="card-lbl">Aktivator — Einstieg</div>
    </div>
    <div class="card-q">${actQHtml}</div>
    <div class="card-sol${ST.openSols.has('act') ? ' show' : ''}">
      <div class="sol-label">Lösung</div>
      <div class="sol-body">${data.activator.sol ? processText(data.activator.sol) : '<span style="color:var(--muted);font-style:italic">Keine Lösung hinterlegt — Doppelklick zum Bearbeiten</span>'}</div>
    </div>
  </div>`;

  grid.innerHTML = html;
  renderMath(grid);
  fitGrid();
  markOneLine(grid);

  grid.querySelectorAll('.tl-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const k = tlKey(btn.dataset.ci);
      if (DATA.SOL[k] === btn.dataset.c) delete DATA.SOL[k]; else DATA.SOL[k] = btn.dataset.c;
      autoSave();
      const card = btn.closest('.card'), v = DATA.SOL[k] || '';
      card.classList.remove('st-r','st-y','st-g');
      if (v) card.classList.add('st-'+v);
      card.querySelectorAll('.tl-btn').forEach(b => b.classList.toggle('on', b.dataset.c === v));
    });
    btn.addEventListener('dblclick', e => e.stopPropagation());
  });

  // Per-card set buttons + alt toggle
  grid.querySelectorAll('.card-set-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const ci = parseInt(btn.dataset.ci);
      if (btn.dataset.alt) {
        // Toggle alt view
        ST.altShown.has(ci) ? ST.altShown.delete(ci) : ST.altShown.add(ci);
        renderCards();
      } else {
        const s = parseInt(btn.dataset.s);
        if (ST.cardSets[ci] !== s) {
          ST.cardSets[ci] = s;
          ST.openSols.delete(ci);
          autoSave();
          renderCards();
        }
      }
    });
  });

  // Click = toggle solution; Double-click = edit
  grid.querySelectorAll('.card[data-type="q"]').forEach(el => {
    let clickTimer = null;
    el.addEventListener('click', e => {
      if (e.target.closest('.card-sol') || e.target.closest('.card-set-row') || e.target.closest('.card-traffic')) return;
      clickTimer = setTimeout(() => {
        const ci = parseInt(el.dataset.ci);
        ST.openSols.has(ci) ? ST.openSols.delete(ci) : ST.openSols.add(ci);
        el.querySelector('.card-sol').classList.toggle('show', ST.openSols.has(ci));
        markOneLine(el);
      }, 220);
    });
    el.addEventListener('dblclick', e => {
      if (e.target.closest('.card-set-row') || e.target.closest('.card-traffic')) return;
      clearTimeout(clickTimer);
      openEditor(parseInt(el.dataset.ci));
    });
  });
  grid.querySelectorAll('.card[data-type="act"]').forEach(el => {
    let clickTimer = null;
    el.addEventListener('click', e => {
      if (e.target.closest('.card-sol')) return;
      clickTimer = setTimeout(() => {
        ST.openSols.has('act') ? ST.openSols.delete('act') : ST.openSols.add('act');
        el.querySelector('.card-sol').classList.toggle('show', ST.openSols.has('act'));
        markOneLine(el);
      }, 220);
    });
    el.addEventListener('dblclick', e => {
      clearTimeout(clickTimer);
      openEditor('act');
    });
  });
}

function updateBar() {
  // Week select
  const sel = document.getElementById('sel-week');
  if (sel.value != ST.week) sel.value = ST.week;

  // Lesson tabs
  document.querySelectorAll('.lesson-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.l === ST.lesson);

  btnAct.classList.toggle('act-off', !ST.showAct);
}

function render() {
  updateBar();
  ST.openSols = new Set();
  ST.altShown = new Set();

  ST.cardSets = {0:2, 1:2, 2:2, 3:2};
  renderCards();
}

function fmtTime(s) {
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function updateTimer() {
  const d = document.getElementById('timer-d');
  const b = document.getElementById('tbar');
  d.textContent = fmtTime(ST.timerSec);
  const pct = (ST.timerSec / ST.timerTotal) * 100;
  b.style.width = pct + '%';
  const warn = ST.timerSec <= 60;
  d.classList.toggle('warn', warn);
  b.classList.toggle('warn', warn);
}
function startTimer() {
  if (_timerInt) return;
  ST.running = true;
  document.getElementById('btn-start').textContent = '⏸ Pause';
  _timerInt = setInterval(() => {
    if (ST.timerSec > 0) { ST.timerSec--; updateTimer(); }
    else { stopTimer(); playBell(); }
  }, 1000);
}
function stopTimer() {
  clearInterval(_timerInt); _timerInt = null; ST.running = false;
  document.getElementById('btn-start').textContent = '▶ Start';
}
function toggleTimer() { ST.running ? stopTimer() : startTimer(); }
function resetTimer() { stopTimer(); ST.timerSec = ST.timerTotal; updateTimer(); }

let _editCI = null;

function openEditor(ci) {
  _editCI = ci;
  const data = getLessonData();
  if (!data) return;

  const isAct = ci === 'act';
  const card = isAct ? data.activator : data.cards[ci];
  if (!card) return;

  document.getElementById('ed-title').textContent = isAct
    ? 'Aktivator bearbeiten'
    : `Aufgabe ${ci+1} bearbeiten`;

  // Hide second column for activator (only one set)
  document.getElementById('ed-col-s3').style.display = isAct ? 'none' : '';
  document.getElementById('ed-sets').style.gridTemplateColumns = isAct ? '1fr' : '1fr 1fr';

  // Populate SET 1 (set index 2)
  const edKey1 = isAct
    ? `${ST.week},${ST.lesson},2,act`
    : `${ST.week},${ST.lesson},2,${ci}`;
  const q1Over = DATA.SOL[edKey1 + ',q'];
  let q1 = q1Over !== undefined ? q1Over : null;
  if (q1 === null && !isAct && card.ref) {
    const [rw,rl] = card.ref;
    const qd = DATA.Q[qKey(rw,rl)];
    if (qd && qd[2]) { const idx = Math.min(ci, qd[2].cards.length-1); q1 = qd[2].cards[idx]; }
  }
  document.getElementById('ed-q').value = q1 || (isAct ? card.q : '') || '';
  document.getElementById('ed-sol').value = DATA.SOL[edKey1 + ',s'] || (isAct ? card.sol : '') || '';

  // Populate SET 2 (set index 3)
  if (!isAct) {
    const edKey2 = `${ST.week},${ST.lesson},3,${ci}`;
    const q2Over = DATA.SOL[edKey2 + ',q'];
    let q2 = q2Over !== undefined ? q2Over : null;
    if (q2 === null && card.ref) {
      const [rw,rl] = card.ref;
      const qd = DATA.Q[qKey(rw,rl)];
      if (qd && qd[3]) { const idx = Math.min(ci, qd[3].cards.length-1); q2 = qd[3].cards[idx]; }
    }
    document.getElementById('ed-q2').value = q2 || '';
    document.getElementById('ed-sol2').value = DATA.SOL[edKey2 + ',s'] || '';
  }

  // Source label
  const lblRow = document.getElementById('ed-lbl-row');
  if (isAct) {
    lblRow.style.display = 'none';
  } else {
    lblRow.style.display = '';
    document.getElementById('ed-lbl').value = card.srcLabel || '';
  }

  // Per-set image panels: show/hide set 2 panel for activator
  const imgPanels = document.getElementById('ed-img-panels');
  const imgColS3 = document.getElementById('ed-img-col-s3');
  if (isAct) {
    imgPanels.style.gridTemplateColumns = '1fr';
    imgColS3.style.display = 'none';
  } else {
    imgPanels.style.gridTemplateColumns = '1fr 1fr';
    imgColS3.style.display = '';
  }

  // Helper to load image into a panel
  function loadImgIntoPanel(suffix, setIdx) {
    const imgKey = isAct
      ? `${ST.week},${ST.lesson},2,act`
      : `${ST.week},${ST.lesson},${setIdx},${ci}`;
    const existing = DATA.IMG[imgKey] || null;
    const prev = document.getElementById('ed-img-preview' + suffix);
    const del = document.getElementById('ed-del-img' + suffix);
    const scaleRow = document.getElementById('ed-scale-row' + suffix);
    const scaleInput = document.getElementById('ed-scale' + suffix);
    const scaleVal = document.getElementById('ed-scale-val' + suffix);
    if (existing) {
      prev.src = existing.src || existing;
      prev.style.display = 'block';
      prev.style.width = (existing.scale || 100) + '%';
      del.style.display = 'block';
      scaleRow.style.display = '';
      scaleInput.value = existing.scale || 100;
      scaleVal.textContent = existing.scale || 100;
    } else {
      prev.src = ''; prev.style.display = 'none';
      del.style.display = 'none';
      scaleRow.style.display = 'none';
      scaleInput.value = 100; scaleVal.textContent = '100';
    }
  }
  loadImgIntoPanel('', 2);
  if (!isAct) loadImgIntoPanel('2', 3);

  updateEditorPreview();
  document.getElementById('editor-overlay').classList.add('open');
}

function updateEditorPreview() {
  const q = document.getElementById('ed-q').value;
  const prev = document.getElementById('ed-preview');
  prev.innerHTML = processText(q) || '<span style="color:var(--muted)">Vorschau...</span>';
  renderMath(prev);
}
function updateEditorPreview2() {
  const q = document.getElementById('ed-q2').value;
  const prev = document.getElementById('ed-preview2');
  prev.innerHTML = processText(q) || '<span style="color:var(--muted)">Vorschau...</span>';
  renderMath(prev);
}

function saveEditor() {
  const isAct = _editCI === 'act';
  const ci = _editCI;

  // Save SET 1 (set index 2)
  const edKey1 = isAct
    ? `${ST.week},${ST.lesson},2,act`
    : `${ST.week},${ST.lesson},2,${ci}`;
  DATA.SOL[edKey1 + ',q'] = document.getElementById('ed-q').value;
  DATA.SOL[edKey1 + ',s'] = document.getElementById('ed-sol').value;

  // Save SET 2 (set index 3) — only for regular cards
  if (!isAct) {
    const edKey2 = `${ST.week},${ST.lesson},3,${ci}`;
    DATA.SOL[edKey2 + ',q'] = document.getElementById('ed-q2').value;
    DATA.SOL[edKey2 + ',s'] = document.getElementById('ed-sol2').value;

    // Source label
    const lbl = document.getElementById('ed-lbl').value.trim();
    if (lbl) DATA.SOL[edKey1 + ',lbl'] = lbl;
    else delete DATA.SOL[edKey1 + ',lbl'];
    // Sync label to set 3 key too
    if (lbl) DATA.SOL[`${ST.week},${ST.lesson},3,${ci},lbl`] = lbl;
    else delete DATA.SOL[`${ST.week},${ST.lesson},3,${ci},lbl`];
  }

  // Save images per set
  function saveImgFromPanel(suffix, setIdx) {
    const imgKey = isAct
      ? `${ST.week},${ST.lesson},2,act`
      : `${ST.week},${ST.lesson},${setIdx},${ci}`;
    const prev = document.getElementById('ed-img-preview' + suffix);
    const scaleInput = document.getElementById('ed-scale' + suffix);
    if (prev.style.display !== 'none' && prev.src && prev.src !== location.href) {
      DATA.IMG[imgKey] = { src: prev.src, scale: parseInt(scaleInput.value) || 100 };
    } else {
      delete DATA.IMG[imgKey];
    }
  }
  saveImgFromPanel('', 2);
  if (!isAct) saveImgFromPanel('2', 3);

  document.getElementById('editor-overlay').classList.remove('open');
  autoSave();
  renderCards();
}

// ═══════════════════════════════════════════════════════════════
//  LOCALSTORAGE AUTOSAVE
// ═══════════════════════════════════════════════════════════════
const LS_KEY = 'donow_mathe9_v1';

function autoSave() {
  try {
    const payload = {
      SOL: DATA.SOL,
      IMG: DATA.IMG,
      ts: Date.now()
    };
    localStorage.setItem(LS_KEY, JSON.stringify(payload));
  } catch(e) { /* storage full or unavailable */ }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const payload = JSON.parse(raw);
    if (payload.SOL) Object.assign(DATA.SOL, payload.SOL);
    if (payload.IMG) Object.assign(DATA.IMG, payload.IMG);
    // Show restore notice
    const ts = payload.ts ? new Date(payload.ts).toLocaleString('de-DE') : '?';
    showToast(`Gespeicherter Stand wiederhergestellt (${ts})`);
    return true;
  } catch(e) { return false; }
}

function clearStorage() {
  localStorage.removeItem(LS_KEY);
  showToast('Lokaler Speicher geleert');
}

function showToast(msg, dur=3000) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);' +
      'background:var(--surf);border:1px solid var(--border);color:var(--text);' +
      'font-family:Syne,sans-serif;font-size:.78rem;padding:8px 18px;border-radius:20px;' +
      'z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, dur);
}

// ═══════════════════════════════════════════════════════════════
//  EXPORT (download updated HTML)
// ═══════════════════════════════════════════════════════════════
function exportData() {
  const payload = {app:'donow_mathe9', version:1, ts:Date.now(), SOL:DATA.SOL, IMG:DATA.IMG};
  const text = JSON.stringify(payload);
  const name = 'donow_daten_' + new Date().toISOString().slice(0,10) + '.json';
  const file = new File([text], name, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]}) && /iPad|iPhone|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
    navigator.share({files:[file], title:name}).catch(()=>{});
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'donow_mathe9' || !d.SOL) throw new Error('Format');
      if (!confirm('Gesicherte Daten laden? Gleiche Aufgaben werden mit dem gesicherten Stand überschrieben, alles andere bleibt erhalten.')) return;
      Object.assign(DATA.SOL, d.SOL);
      if (d.IMG) Object.assign(DATA.IMG, d.IMG);
      autoSave(); render();
      showToast('Daten geladen');
    } catch (e) { showToast('Diese Datei ist keine gültige Daten-Sicherung', 4000); }
  };
  r.readAsText(file);
}
function exportHTML() {
  // Get current page HTML
  let html = document.documentElement.outerHTML;

  // Replace DATA.SOL and DATA.IMG with current values
  const solJS = 'DATA.SOL = ' + JSON.stringify(DATA.SOL, null, 2) + ';';
  const imgJS = 'DATA.IMG = ' + JSON.stringify(DATA.IMG, null, 2) + ';';

  // Inject before closing script tag of data section
  // Replace placeholder empty objects
  html = html.replace('const DATA = {\n  Q: {},\n  RP: {},\n  LABEL: {},\n  SOL: {},\n  IMG: {}\n};',
    'const DATA = {\n  Q: {},\n  RP: {},\n  LABEL: {},\n  SOL: {},\n  IMG: {}\n};\n' +
    solJS + '\n' + imgJS);

  const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'donow_mathe9.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════
//  BELL SOUND (Web Audio API — 3 gong strikes)
// ═══════════════════════════════════════════════════════════════
function playBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function strike(t) {
      // Fundamental + harmonics for a bell-like tone
      [[220,1],[440,.5],[660,.25],[880,.12]].forEach(([freq, gain]) => {
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        env.gain.setValueAtTime(gain, t);
        env.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
        osc.connect(env); env.connect(ctx.destination);
        osc.start(t); osc.stop(t + 2.5);
      });
    }
    strike(ctx.currentTime);
    strike(ctx.currentTime + 1.0);
    strike(ctx.currentTime + 2.0);
  } catch(e) { /* no audio support */ }
}


// ═══════════════════════════════════════════════════════════════
//  SHIFT LESSON (push current lesson one slot forward)
// ═══════════════════════════════════════════════════════════════

// Convert (week, lesson) to a flat 0-based index: week 1 lesson 1 = 0
function wlToIdx(w, l) { return (w - 1) * 3 + (l - 1); }
function idxToWL(idx)  { return { w: Math.floor(idx / 3) + 1, l: (idx % 3) + 1 }; }
const MAX_SLOT = 44 * 3 - 1; // W44/Std3 = index 131

function shiftLesson(fromW, fromL) {
  const fromIdx = wlToIdx(fromW, fromL);
  if (fromIdx >= MAX_SLOT) return; // nothing to shift from last slot

  // Walk backwards from the last slot down to fromIdx+1,
  // copying each slot's RP and SOL/IMG overrides one step forward.
  // Then clear the fromIdx slot.
  for (let idx = MAX_SLOT; idx > fromIdx; idx--) {
    const src = idxToWL(idx - 1);   // source
    const dst = idxToWL(idx);        // destination

    const srcKey = rpKey(src.w, src.l);
    const dstKey = rpKey(dst.w, dst.l);

    // Copy RP
    DATA.RP[dstKey] = DATA.RP[srcKey]
      ? DATA.RP[srcKey].map(r => r ? [r[0], r[1]] : null)
      : [null, null, null, null];

    for (const ci of [0,1,2,3]) {
      const sv = DATA.SOL[`${src.w},${src.l},${ci},tl`];
      if (sv !== undefined) DATA.SOL[`${dst.w},${dst.l},${ci},tl`] = sv; else delete DATA.SOL[`${dst.w},${dst.l},${ci},tl`];
    }
    // Copy SOL/IMG overrides for both sets (2 and 3)
    for (const s of [2, 3]) {
      for (const ci of [0, 1, 2, 3, 'act']) {
        const srcEdBase = `${src.w},${src.l},${s},${ci}`;
        const dstEdBase = `${dst.w},${dst.l},${s},${ci}`;
        for (const suffix of [',q', ',s', ',lbl']) {
          const sv = DATA.SOL[srcEdBase + suffix];
          if (sv !== undefined) DATA.SOL[dstEdBase + suffix] = sv;
          else delete DATA.SOL[dstEdBase + suffix];
        }
        const img = DATA.IMG[srcEdBase];
        if (img !== undefined) DATA.IMG[dstEdBase] = img;
        else delete DATA.IMG[dstEdBase];
      }
    }
  }

  // Clear the fromIdx slot (it is now empty — the lesson was cancelled)
  const cleared = idxToWL(fromIdx);
  const clearedKey = rpKey(cleared.w, cleared.l);
  DATA.RP[clearedKey] = [null, null, null, null];
  for (const ci of [0,1,2,3]) delete DATA.SOL[`${cleared.w},${cleared.l},${ci},tl`];
  for (const s of [2, 3]) {
    for (const ci of [0, 1, 2, 3, 'act']) {
      const edBase = `${cleared.w},${cleared.l},${s},${ci}`;
      for (const suffix of [',q', ',s', ',lbl']) delete DATA.SOL[edBase + suffix];
      delete DATA.IMG[edBase];
    }
  }

  autoSave();
  render();
}

// ═══════════════════════════════════════════════════════════════

function populateWeeks() {
  const sel = document.getElementById('sel-week');

  for (let w = 1; w <= 44; w++) {

}

// ═══════════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  populateWeeks();
  updateTimer();
  loadFromStorage();
  // Restore font scale
  try { const fs=parseFloat(localStorage.getItem('donow_fs')); if(fs) setFontScale(fs); } catch(e){}
  render();

  document.getElementById('sel-week').addEventListener('change', e => {
    ST.week = +e.target.value;
    ST.lesson = 1;
    render();
  });

  document.querySelectorAll('.lesson-btn').forEach(b => {
    b.addEventListener('click', () => { ST.lesson = +b.dataset.l; render(); });
  });
  document.getElementById('btn-start').addEventListener('click', toggleTimer);
  document.getElementById('timer-d').addEventListener('click', toggleTimer);
  // Dropdown-Menü
  const _mp = document.getElementById('menu-panel'), _mb = document.getElementById('btn-menu');
  const _closeMenu = () => { _mp.classList.remove('open'); _mb.setAttribute('aria-expanded','false'); };
  _mb.addEventListener('click', e => { e.stopPropagation(); const o = _mp.classList.toggle('open'); _mb.setAttribute('aria-expanded', o); });
  _mp.addEventListener('click', e => { if (e.target.closest('button') && e.target !== _mb) setTimeout(_closeMenu, 0); e.stopPropagation(); });
  document.addEventListener('click', _closeMenu);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') _closeMenu(); });
  document.getElementById('fs-slider').addEventListener('input', e => setFontScale(parseFloat(e.target.value)));

  // Shift lesson
  document.getElementById('btn-shift').addEventListener('click', () => {
    const msg = document.getElementById('shift-msg');
    const lastWL = idxToWL(MAX_SLOT);
    msg.innerHTML =
      `Diese Aktion verschiebt <strong>W${ST.week}/Std.${ST.lesson}</strong> und alle folgenden Stunden um einen Slot nach hinten.<br><br>` +
      `Die letzte Stunde <strong>W${lastWL.w}/Std.${lastWL.l}</strong> fällt dabei weg.<br><br>` +
      `Dieser Vorgang kann nicht rückgängig gemacht werden.`;
    document.getElementById('shift-overlay').classList.add('open');
  });
  document.getElementById('shift-confirm').addEventListener('click', () => {
    document.getElementById('shift-overlay').classList.remove('open');
    shiftLesson(ST.week, ST.lesson);
  });
  document.getElementById('shift-cancel-btn').addEventListener('click', () => {
    document.getElementById('shift-overlay').classList.remove('open');
  });
  document.getElementById('shift-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('shift-overlay'))
      document.getElementById('shift-overlay').classList.remove('open');
  });
  document.getElementById('btn-reset').addEventListener('click', resetTimer);
  document.getElementById('btn-act').addEventListener('click', () => {
    ST.showAct = !ST.showAct;
    updateBar();
    document.querySelector('.card-act')?.classList.toggle('hidden', !ST.showAct);
  });
  function makePrintCopy() {
    // Remove existing copy if any
    const old = document.getElementById('grid-copy');
    if (old) old.remove();
    // Tatsächlich angezeigte Bildbreite (Anteil an der Kartenbreite) merken,
    // damit der Druck 80 % davon verwendet – auch im Modus „Alles sichtbar“
    const orig = document.getElementById('grid');
    orig.querySelectorAll('.card[data-type="q"] .card-img').forEach(im => {
      const card = im.closest('.card'), cs = getComputedStyle(card);
      const inner = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const w = im.getBoundingClientRect().width;
      if (inner > 0 && w > 0) im.style.setProperty('--disp', (w / inner * 100).toFixed(2));
    });
    // Clone the grid, keeping only the 4 question cards
    const copy = orig.cloneNode(true);
    copy.id = 'grid-copy';
    // Remove activator from copy
    copy.querySelectorAll('[data-type="act"]').forEach(el => el.remove());
    // Insert after the original grid
    orig.insertAdjacentElement('afterend', copy);
    // Re-render math in copy
    renderMath(copy);
  }
  // Kopie bleibt bis nach dem Druck bestehen (iPad/Safari druckt asynchron)
  try {
    if (/iPad|iPhone/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
      document.body.classList.add('ipad');
  } catch(e) {}
  window.addEventListener('beforeprint', makePrintCopy);
  window.addEventListener('afterprint', () => {
    document.body.classList.remove('print-with-sol');
    removePrintCopy();
  });
  function removePrintCopy() {
    const c = document.getElementById('grid-copy');
    if (c) c.remove();
  }

  document.getElementById('btn-print').addEventListener('click', () => {
    document.body.classList.remove('print-with-sol');
    makePrintCopy();
    setTimeout(() => { window.print(); }, 120);
  });
  document.getElementById('btn-print-sol').addEventListener('click', () => {
    const data = getLessonData();
    data.cards.forEach((_, i) => ST.openSols.add(i));
    renderCards();
    document.body.classList.add('print-with-sol');
    makePrintCopy();
    setTimeout(() => { window.print(); }, 180);
  });
  document.getElementById('btn-save').addEventListener('click', exportHTML);
  document.getElementById('btn-fit').addEventListener('click', () => {
    const on = !document.body.classList.contains('fit');
    document.body.classList.toggle('fit', on);
    try { localStorage.setItem('donow_fit', on ? '1' : '0'); } catch(e) {}
    fitGrid();
  });
  window.addEventListener('resize', fitGrid);
  let _fit0 = true; try { _fit0 = localStorage.getItem('donow_fit') !== '0'; } catch(e) {}
  document.body.classList.toggle('fit', _fit0);
  document.getElementById('btn-data-out').addEventListener('click', exportData);
  document.getElementById('btn-data-in').addEventListener('click', () => document.getElementById('data-file').click());
  document.getElementById('data-file').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
  document.getElementById('btn-clear-storage').addEventListener('click', () => {
    if (confirm('Alle lokal gespeicherten Änderungen löschen? Das kann nicht rückgängig gemacht werden.')) {
      clearStorage();
    }
  });

  // Editor
  document.getElementById('ed-q').addEventListener('input', updateEditorPreview);
  // Scale events are handled per-panel inside setupImgPanel()
  document.getElementById('ed-q2').addEventListener('input', updateEditorPreview2);
  document.getElementById('ed-save').addEventListener('click', saveEditor);
  document.getElementById('ed-cancel').addEventListener('click', () => {
    document.getElementById('editor-overlay').classList.remove('open');
  });
  document.getElementById('editor-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('editor-overlay'))
      document.getElementById('editor-overlay').classList.remove('open');
  });

  // Image upload — generic setup for one panel
  function setupImgPanel(suffix) {
    const dropArea  = document.getElementById('ed-drop'  + suffix);
    const fileInput = document.getElementById('ed-file'  + suffix);
    const imgPrev   = document.getElementById('ed-img-preview' + suffix);
    const delBtn    = document.getElementById('ed-del-img' + suffix);
    const scaleRow  = document.getElementById('ed-scale-row' + suffix);
    const scaleInput= document.getElementById('ed-scale'  + suffix);
    const scaleVal  = document.getElementById('ed-scale-val' + suffix);

    function loadImg(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        const imgEl = new Image();
        imgEl.onload = () => {
          const MAX = 800;
          let w = imgEl.width, h = imgEl.height;
          if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(imgEl, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          imgPrev.src = dataUrl;
          imgPrev.style.display = 'block';
          imgPrev.style.width = '100%';
          delBtn.style.display = 'block';
          scaleRow.style.display = '';
          scaleInput.value = 100;
          scaleVal.textContent = '100';
        };
        imgEl.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Button: Bild aus Zwischenablage (iPad: Antippen, dann „Einsetzen“ bestätigen)
    const pasteBtn = document.createElement('button');
    pasteBtn.type = 'button';
    pasteBtn.textContent = '📋 Aus Zwischenablage einfügen';
    pasteBtn.style.cssText = 'margin-top:8px;width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:.9rem;cursor:pointer';
    dropArea.insertAdjacentElement('afterend', pasteBtn);
    pasteBtn.addEventListener('click', async e => {
      e.stopPropagation();
      try {
        if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('nosupport');
        const items = await navigator.clipboard.read();
        for (const it of items) {
          const t = it.types.find(x => x.startsWith('image/'));
          if (t) { loadImg(await it.getType(t)); showToast('Bild aus Zwischenablage eingefügt'); return; }
        }
        showToast('Kein Bild in der Zwischenablage gefunden');
      } catch (err) {
        showToast('Einfügen nicht möglich: Bild kopieren (lange drücken → Kopieren) und erneut tippen', 5000);
      }
    });

    dropArea.addEventListener('click', e => { if (e.target !== imgPrev) fileInput.click(); });
    dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('drag'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag'));
    dropArea.addEventListener('drop', e => {
      e.preventDefault(); dropArea.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImg(file);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadImg(fileInput.files[0]); });
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      imgPrev.src = ''; imgPrev.style.display = 'none';
      delBtn.style.display = 'none';
      scaleRow.style.display = 'none';
    });
    scaleInput.addEventListener('input', () => {
      scaleVal.textContent = scaleInput.value;
      if (imgPrev.style.display !== 'none') imgPrev.style.width = scaleInput.value + '%';
    });
    dropArea.addEventListener('paste', e => {
      const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault(); loadImg(item.getAsFile());
          showToast('Bild aus Zwischenablage eingefügt'); break;
        }
      }
    });

    return loadImg;  // expose so clipboard handler can call it
  }

  const loadImgS1 = setupImgPanel('');
  const loadImgS2 = setupImgPanel('2');

  // Global clipboard paste: route to whichever panel last had focus,
  // or default to SET 1
  let _activeImgPanel = '';   // '' = set1, '2' = set2
  document.getElementById('ed-drop').addEventListener('mouseenter', () => { _activeImgPanel = ''; });
  document.getElementById('ed-drop2').addEventListener('mouseenter', () => { _activeImgPanel = '2'; });

  document.addEventListener('paste', e => {
    if (!document.getElementById('editor-overlay').classList.contains('open')) return;
    // Don't intercept paste inside textarea
    if (document.activeElement?.tagName === 'TEXTAREA') return;
    const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        (_activeImgPanel === '2' ? loadImgS2 : loadImgS1)(item.getAsFile());
        showToast('Bild in Set ' + (_activeImgPanel === '2' ? '2' : '1') + ' eingefügt'); break;
      }
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    if (['INPUT','TEXTAREA','SELECT'].includes(tag)) return;
    if (document.getElementById('editor-overlay').classList.contains('open')) return;
    switch(e.key) {
      case '1': ST.lesson=1; render(); break;
      case '2': ST.lesson=2; render(); break;
      case '3': ST.lesson=3; render(); break;
      case '4': ST.set=2; render(); break;
      case '5': ST.set=3; render(); break;
      case '7': toggleTimer(); break;
      case '8': document.getElementById('btn-act').click(); break;
      case '9': setFontScale(_fs - FS_STEP); break;
      case '0': setFontScale(_fs + FS_STEP); break;
    }
  });
});

// If DOM already loaded (shouldn't happen but safe)
if (document.readyState !== 'loading') {
  populateWeeks(); updateTimer(); render();
}
